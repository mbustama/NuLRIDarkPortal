[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nulri-dark-portal"
version = "0.1.0"
description = "High-energy astrophysical neutrino propagation under dark-portal LRI physics, with a frequentist flavor-ratio analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mauricio Bustamante" }]
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# The frequentist profile-likelihood pipeline (FrequentistAnalysis/)
analysis = ["iminuit", "emcee"]
# The optional CUDA spatial handover (src/gpu_spatial.py); pick the wheel matching
# your CUDA toolkit if cuda12x is not right for your system.
gpu = ["cupy-cuda12x"]
test = ["pytest"]

[tool.setuptools]
# The core solver is a set of flat modules under src/ (imported as top-level names,
# e.g. `import dark_portal_solver`), matching how the scripts and the
# FrequentistAnalysis tree consume them. `pip install -e .` exposes them without the
# sys.path manipulation the scripts otherwise perform.
package-dir = { "" = "src" }
py-modules = ["dark_portal_solver", "dark_portal_scanner", "flux_postprocessing", "gpu_spatial"]
