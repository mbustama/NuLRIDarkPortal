[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nulri-dark-portal"
version = "0.1.0"
description = "High-energy astrophysical neutrino propagation under dark-portal LRI physics, with a profile-likelihood flavor-ratio analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mauricio Bustamante" }]
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# The optional CUDA spatial handover (src/gpu_spatial.py); pick the wheel matching
# your CUDA toolkit if cuda12x is not right for your system.
gpu = ["cupy-cuda12x"]
test = ["pytest", "mpmath"]

[tool.setuptools]
# The core solver is a set of flat modules under src/ (imported as top-level names,
# e.g. `import dark_portal_solver`), matching how the scripts and the analysis
# package (analysis/, run from the repository root) consume them. `pip install -e .` exposes them without the
# sys.path manipulation the scripts otherwise perform.
package-dir = { "" = "src" }
py-modules = ["dark_portal_solver", "dp_core", "dp_propagator", "dp_thermal", "dp_cosmo",
              "dp_spatial", "dp_config", "dark_portal_scanner", "flux_postprocessing", "gpu_spatial"]

[tool.pytest.ini_options]
# slow: full fits that take minutes on a laptop and 10-20 on CI's runners (which stopped at their 30-minute limit
# on 2026-10-17); CI skips them (-m "not slow"), slurm/test.sh runs everything on Tycho.
markers = ["slow: full fits taking minutes; skipped on CI, run on Tycho by slurm/test.sh"]
