name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    # Two environments: the versions the results are computed with (the laptop's and Tycho's,
    # slurm/README.md) and the latest releases, which catch incompatibilities early (NumPy 2.x
    # removed np.trapz, and the unpinned job alone failed from 2026-10-13 until it was noticed).
    name: pytest (${{ matrix.deps.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        deps:
          - name: pinned
            pip: numpy==1.26.4 scipy==1.15.3 numba==0.60.0 llvmlite==0.43.0 matplotlib==3.10.8 tqdm==4.67.3 pytest==9.0.3 mpmath==1.3.0 tbb==2023.1.0
          - name: latest
            pip: numpy scipy numba matplotlib tqdm pytest mpmath
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.deps.pip }}

      - name: Run the test suite
        # First run includes numba JIT compilation of every kernel (a few minutes cold).
        # The GPU test self-skips on CUDA-less runners. Tests marked slow (full fits, 10-20 minutes each here)
        # run on Tycho instead (slurm/test.sh).
        run: python -m pytest tests/ -v -m "not slow"
