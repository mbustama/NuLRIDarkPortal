name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy numba matplotlib tqdm pytest mpmath

      - name: Run regression suite and analysis tests
        # First run includes numba JIT compilation of every kernel (a few minutes cold).
        # The GPU test self-skips on CUDA-less runners.
        run: python -m pytest tests/ -v
